[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dummy-assembly"
version = "0.0.1"
description = "DUMMY: an SO-101 robotic assembly assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
