[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo2sim"
version = "0.0.1"
description = "Kamino: photos to editable MuJoCo simulation assets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "pydantic>=2,<3", "httpx", "python-multipart", "pillow", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
simulation = ["mujoco", "trimesh", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["photo2sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
